            background: #cbd5e1;

            background: #94a3b8;
        }

            animation: fadeIn 0.2s ease-in-out;
        }

            from {
                opacity: 0;
                transform: translateY(-5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Sidebar transition for mobile */
        #sidebar {
            transition: transform 0.3s ease-in-out;

        @media (max-width: 768px) {

        // --- 3. STATE MANAGEMENT (with Firebase) ---
        class AppState {
            constructor() {
                this.account = null; // Start null to force login
                this.modules = {};
                this.procedureLog = [];
                this.milestones = {};
                this.activeTab = 'dashboard';
                this.listeners = [];
                this._loginHandled = false;
                this.driveToken = null;
                this.driveFolders = {};

                moduleConfigs.forEach(m => { this.modules[m.id] = { assignments: {}, weeks: {}, caseReports: {}, rotations: [] }; });

                this.initFirebase();
                this.loadData();
            }

            initFirebase() {
                const firebaseConfig = {
                    apiKey: "AIzaSyBhEln9kmgq22NnNHI83eUH7_d6S4F1O5s",
                    authDomain: "rural-mmed-logbook-3e095.firebaseapp.com",
                    projectId: "rural-mmed-logbook-3e095",
                    storageBucket: "rural-mmed-logbook-3e095.firebasestorage.app",
                    messagingSenderId: "826477177641",
                    appId: "1:826477177641:web:fe9de6e733b442fdffe538"
                };

                try {
                    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                    window.auth = firebase.auth();
                    window.db = firebase.firestore();

                    // Check redirect result on every init (no-ops if empty)
                    window.auth.getRedirectResult().then(result => {
                        if (result && result.user) {
                            if (result.credential) this.driveToken = result.credential.accessToken;
                            this.handleCloudLogin(result.user);
                        }
                    }).catch(e => console.error("Redirect Error:", e));

                    window.auth.onAuthStateChanged(user => {
                        if (user) this.handleCloudLogin(user);
                        else {
                            this.account = null;
                            this.notify();
                        }
                    });
                } catch (e) {
                    console.error("Firebase Init Failed", e);
                    // Fallback to local only for demo if offline
                    const stored = localStorage.getItem('mmed_tracker_v2_cloud');
                    if (stored) this.account = JSON.parse(stored).account;
                }
            }

            async handleCloudLogin(user) {
                if (this._loginHandled && this.account && this.account.id === user.uid) return;
                this._loginHandled = true;

                const loading = document.getElementById('loading');
                if (loading) loading.style.display = 'flex';

                try {
                    const doc = await window.db.collection('users').doc(user.uid).get();
                    const cloudData = doc.exists ? doc.data() : {};

                    this.account = {
                        name: cloudData.account?.name || user.displayName || "Dr. Trainee",
                        email: user.email,
                        id: user.uid,
                        year: cloudData.account?.year || 1,
                        location: cloudData.account?.location || "General Hospital",
                        lastBackup: Date.now()
                    };

                    // --- Merge Strategy (#7): Compare timestamps, prompt on conflict ---
                    const localLastMod = this.account?.lastModified || 0;
                    const cloudLastMod = cloudData.lastModified || 0;
                    const hasLocalData = this.procedureLog.length > 0 || Object.keys(this.modules).length > 0;
                    const hasCloudData = cloudData.modules || cloudData.procedureLog;

                    let mergeChoice = 'cloud'; // default: cloud wins
                    if (hasLocalData && hasCloudData && localLastMod > 0 && Math.abs(localLastMod - cloudLastMod) > 5000) {
                        // Both have data and they differ — prompt user
                        mergeChoice = await new Promise(resolve => {
                            const m = document.createElement('div');
                            m.className = 'fixed inset-0 bg-slate-900 bg-opacity-60 z-50 flex items-center justify-center p-4 fade-in backdrop-blur-sm';
                            m.innerHTML = `
                                <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6">
                                    <h2 class="text-xl font-bold text-slate-800 mb-4"><i class="fas fa-exclamation-triangle text-amber-500 mr-2"></i>Data Conflict</h2>
                                    <p class="text-sm text-slate-600 mb-4">Both your device and the cloud have data. How would you like to proceed?</p>
                                    <p class="text-xs text-slate-400 mb-4">Local: ${new Date(localLastMod).toLocaleString()} | Cloud: ${new Date(cloudLastMod).toLocaleString()}</p>
                                    <div class="space-y-2">
                                        <button onclick="this.closest('.fixed').remove();" data-choice="cloud" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition"><i class="fas fa-cloud mr-2"></i>Keep Cloud Data</button>
                                        <button onclick="this.closest('.fixed').remove();" data-choice="local" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg transition"><i class="fas fa-laptop mr-2"></i>Keep Local Data</button>
                                    </div>
                                </div>
                            `;
                            m.querySelectorAll('button[data-choice]').forEach(btn => {
                                btn.addEventListener('click', () => resolve(btn.dataset.choice));
                            });
                            document.body.appendChild(m);
                        });
                    }

                    this.account = {
                        name: cloudData.account?.name || user.displayName || "Dr. User",
                        email: user.email,
                        id: user.uid,
                        year: cloudData.account?.year || 1,
                        location: cloudData.account?.location || "General Hospital",
                        lastBackup: Date.now()
                    };

                    if (mergeChoice === 'cloud') {
                        // Cloud wins — overwrite local
                        if (cloudData.modules) this.modules = cloudData.modules;
                        if (cloudData.procedureLog) this.procedureLog = cloudData.procedureLog;
                        if (cloudData.milestones) this.milestones = cloudData.milestones;
                    }
                    // If 'local', we keep what's already loaded from localStorage

                    // Load cached Drive folder IDs
                    if (cloudData.driveFolders) this.driveFolders = cloudData.driveFolders;

                    // --- Subcollection migration (#5): Move embedded procedureLogs ---
                    if (cloudData.procedureLog && Array.isArray(cloudData.procedureLog) && cloudData.procedureLog.length > 0 && window.db) {
                        try {
                            const batch = window.db.batch();
                            cloudData.procedureLog.forEach(entry => {
                                const docId = entry.id || crypto.randomUUID();
                                if (!entry.id) entry.id = docId;
                                const ref = window.db.collection('users').doc(user.uid).collection('procedureLogs').doc(docId);
                                batch.set(ref, entry);
                            });
                            await batch.commit();
                            // Remove embedded array from user doc
                            await window.db.collection('users').doc(user.uid).update(
                                { procedureLog: firebase.firestore.FieldValue.delete() }
                            );
                            console.log('Migrated', cloudData.procedureLog.length, 'logs to subcollection');
                        } catch (migErr) {
                            console.warn('Subcollection migration error (will retry):', migErr);
                        }
                    }

                    // Load procedure logs from subcollection
                    try {
                        const logsSnap = await window.db.collection('users').doc(user.uid).collection('procedureLogs').get();
                        if (!logsSnap.empty) {
                            this.procedureLog = logsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
                        }
                    } catch (logErr) {
                        console.warn('Could not load subcollection logs:', logErr);
                    }

                    this.saveData(true); // Save local copy
                } catch (e) {
                    console.error("Sync Error", e);
                    // Fallback to offline user
                    this.account = { name: user.displayName || "Dr. User", email: user.email, id: user.uid, year: 1, location: "Offline Mode" };
                } finally {
                    if (loading) loading.style.display = 'none';
                    this.notify();
                    // Force refresh to ensure UI updates
                    if (document.getElementById('login-container')) document.getElementById('login-container').classList.add('hidden');
                    if (document.getElementById('main-layout')) document.getElementById('main-layout').classList.remove('hidden');
                }
            }

            // --- Google Drive API Helpers ---
            async driveApiFetch(url, options = {}) {
                if (!this.driveToken) { console.warn('No Drive token available'); return null; }
                const resp = await fetch(url, {
                    ...options,
                    headers: { 'Authorization': `Bearer ${this.driveToken}`, ...(options.headers || {}) }
                });
                if (!resp.ok) {
                    const err = await resp.text();
                    console.error('Drive API error:', resp.status, err);
                    if (resp.status === 401) { this.driveToken = null; }
                    return null;
                }
                return resp;
            }

            async ensureDriveFolder(name, parentId = null) {
                // Check if folder exists
                let q = `name='${name}' and mimeType='application/vnd.google-apps.folder' and trashed=false`;
                if (parentId) q += ` and '${parentId}' in parents`;
                const searchResp = await this.driveApiFetch(
                    `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id,name)&spaces=drive`
                );
                if (searchResp) {
                    const data = await searchResp.json();
                    if (data.files && data.files.length > 0) return data.files[0].id;
                }
                // Create folder
                const meta = { name, mimeType: 'application/vnd.google-apps.folder' };
                if (parentId) meta.parents = [parentId];
                const createResp = await this.driveApiFetch('https://www.googleapis.com/drive/v3/files', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(meta)
                });
                if (createResp) {
                    const folder = await createResp.json();
                    return folder.id;
                }
                return null;
            }

            async initDriveFolders(moduleId) {
                if (!this.driveToken) return null;
                // Ensure root folder
                if (!this.driveFolders.root) {
                    this.driveFolders.root = await this.ensureDriveFolder('MMed Portfolio');
                    if (!this.driveFolders.root) return null;
                }
                // Ensure module sub-folder
                if (!this.driveFolders[moduleId]) {
                    const config = moduleConfigs.find(m => m.id === moduleId);
                    const folderName = config ? config.name.split(' (')[0] : moduleId;
                    this.driveFolders[moduleId] = await this.ensureDriveFolder(folderName, this.driveFolders.root);
                }
                // Save folder IDs to cloud
                this.saveDriveFolders();
                return this.driveFolders[moduleId];
            }

            saveDriveFolders() {
                if (this.account?.id && window.db) {
                    window.db.collection('users').doc(this.account.id).set({ driveFolders: this.driveFolders }, { merge: true }).catch(e => console.error('Save folders error:', e));
                }
            }

            async uploadToDrive(file, moduleId) {
                const folderId = await this.initDriveFolders(moduleId);
                if (!folderId) return null;
                const metadata = { name: file.name, parents: [folderId] };
                const form = new FormData();
                form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
                form.append('file', file);
                const resp = await this.driveApiFetch(
                    'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,size,mimeType,webViewLink,createdTime',
                    { method: 'POST', body: form }
                );
                if (resp) return await resp.json();
                return null;
            }

            async listDriveFiles(moduleId) {
                const folderId = this.driveFolders[moduleId];
                if (!folderId || !this.driveToken) return [];
                const q = `'${folderId}' in parents and trashed=false`;
                const resp = await this.driveApiFetch(
                    `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id,name,size,mimeType,webViewLink,thumbnailLink,createdTime)&orderBy=createdTime desc&spaces=drive`
                );
                if (resp) {
                    const data = await resp.json();
                    return data.files || [];
                }
                return [];
            }

            async deleteDriveFile(fileId) {
                if (!this.driveToken) return false;
                const resp = await this.driveApiFetch(`https://www.googleapis.com/drive/v3/files/${fileId}`, { method: 'DELETE' });
                return resp !== null;
            }

            loadData() {
                try {
                    const stored = localStorage.getItem('mmed_tracker_v2_cloud');
                    if (stored && stored !== "null") {
                        const data = JSON.parse(stored);
                        if (data && typeof data === 'object') {
                            if (data.account) this.account = data.account;
                            if (data.modules) this.modules = data.modules;
                            if (data.procedureLog) this.procedureLog = data.procedureLog;
                            if (data.milestones) this.milestones = data.milestones;
                        }
                    }
                } catch (e) { console.error("Local Load Failed", e); }
            }

            saveData(skipCloud = false) {
                const now = Date.now();
                this.account.lastModified = now;
                const data = { account: this.account, modules: this.modules, milestones: this.milestones };
                // Keep procedureLog in localStorage for offline access
                const localData = { ...data, procedureLog: this.procedureLog };
                localStorage.setItem('mmed_tracker_v2_cloud', JSON.stringify(localData));

                if (!skipCloud && this.account && window.db && this.account.id) {
                    clearTimeout(this._saveTimeout);
                    this._saveTimeout = setTimeout(async () => {
                        try {
                            // Granular write: account, modules, milestones (no procedureLog blob)
                            await window.db.collection('users').doc(this.account.id).set(
                                { ...data, lastModified: now },
                                { merge: true }
                            );
                        } catch (e) { console.error("Cloud Save Failing:", e); }
                    }, 1500);
                }
                this.notify();
            }

            // Auth Actions
            signInGoogle() {
                const provider = new firebase.auth.GoogleAuthProvider();
                provider.addScope('https://www.googleapis.com/auth/drive.file');
                window.auth.signInWithPopup(provider)
                    .then(r => {
                        if (r.credential) this.driveToken = r.credential.accessToken;
                        this.handleCloudLogin(r.user);
                    })
                    .catch(e => {
                        // Only redirect on real popup failures, not user cancel
                        if (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') {
                            console.log('User cancelled popup sign-in.');
                            return;
                        }
                        console.warn("Popup blocked, trying redirect", e.code);
                        window.auth.signInWithRedirect(provider);
                    });
            }

            signInEmail() {
                const e = document.getElementById('login-email').value.trim();
                const p = document.getElementById('login-password').value;
                const errorEl = document.getElementById('login-error');
                const showError = msg => { errorEl.textContent = msg; errorEl.classList.remove('hidden'); };
                errorEl.classList.add('hidden');

                if (!e || !p) return showError('Please enter email and password.');

                const friendlyErrors = {
                    'auth/wrong-password': 'Incorrect password. Please try again.',
                    'auth/invalid-credential': 'Incorrect email or password. Please try again.',
                    'auth/invalid-email': 'Please enter a valid email address.',
                    'auth/too-many-requests': 'Too many attempts. Please wait a moment and try again.',
                    'auth/user-disabled': 'This account has been disabled. Contact your administrator.',
                    'auth/network-request-failed': 'Network error. Please check your internet connection.',
                    'auth/email-already-in-use': 'An account with this email already exists. Please sign in instead.',
                    'auth/weak-password': 'Password must be at least 6 characters.',
                    'auth/user-not-found': 'No account found with this email. Please sign up first.'
                };

                const isSignUp = this._isSignUpMode;

                if (isSignUp) {
                    const cp = document.getElementById('login-confirm-password').value;
                    if (p.length < 6) return showError('Password must be at least 6 characters.');
                    if (p !== cp) return showError('Passwords do not match.');

                    window.auth.createUserWithEmailAndPassword(e, p)
                        .then(r => {
                            const displayName = document.getElementById('login-name').value.trim();
                            if (displayName) {
                                r.user.updateProfile({ displayName }).then(() => this.handleCloudLogin(r.user));
                            } else {
                                this.handleCloudLogin(r.user);
                            }
                        })
                        .catch(err => showError(friendlyErrors[err.code] || err.message));
                } else {
                    window.auth.signInWithEmailAndPassword(e, p)
                        .catch(err => showError(friendlyErrors[err.code] || err.message));
                }
            }

            logout() {
                this._loginHandled = false;
                if (window.auth) window.auth.signOut();
                this.account = null;
                localStorage.removeItem('mmed_tracker_v2_cloud'); // Clear active session data
                location.reload();
            }

            exportData() {
                this.saveData(true);
                const dataStr = localStorage.getItem('mmed_tracker_v2_cloud');
                const blob = new Blob([dataStr || "{}"], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = 'mmed_backup_' + new Date().toISOString().split('T')[0] + '.json';
                a.click(); URL.revokeObjectURL(url);
            }

            async getGapiToken() {
                const provider = new firebase.auth.GoogleAuthProvider();
                provider.addScope('https://www.googleapis.com/auth/drive.file');
                try {
                    const result = await window.auth.signInWithPopup(provider);
                    return result.credential.accessToken;
                } catch (e) {
                    console.error("Token Error", e);
                    return null;
                }
            }

            async backupToDrive() {
                try {
                    document.getElementById('backupModal').classList.add('hidden');
                    document.getElementById('loading').classList.remove('hidden');

                    if (!this.driveToken) this.driveToken = await this.getGapiToken();
                    if (!this.driveToken) throw new Error('Could not get Google Drive access.');

                    const folderId = await this.ensureDriveFolder('MMed Portfolio');
                    if (!folderId) throw new Error('Could not create portfolio folder.');

                    this.saveData(true);
                    const dataStr = localStorage.getItem('mmed_tracker_v2_cloud');
                    const fileName = 'mmed_backup_' + new Date().toISOString().split('T')[0] + '.json';

                    // Prepare multipart body
                    const metadata = {
                        name: fileName,
                        parents: [folderId],
                        mimeType: 'application/json'
                    };

                    const form = new FormData();
                    form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
                    form.append('file', new Blob([dataStr], { type: 'application/json' }));

                    const resp = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${this.driveToken}` },
                        body: form
                    });

                    if (!resp.ok) throw new Error(await resp.text());

                    document.getElementById('loading').classList.add('hidden');
                    alert('✅ Backup saved explicitly to Google Drive/MMed Portfolio!');
                } catch (err) {
                    document.getElementById('loading').classList.add('hidden');
                    console.error('Backup error:', err);
                    alert('Backup Failed: ' + err.message);
                }
            }

            importData() {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.json';
                input.onchange = (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        try {
                            const data = JSON.parse(ev.target.result);
                            if (!data || typeof data !== 'object') throw new Error('Invalid format');
                            if (confirm('This will replace all current data with the backup. Are you sure?')) {
                                if (data.account) this.account = data.account;
                                if (data.modules) this.modules = data.modules;
                                if (data.procedureLog) this.procedureLog = data.procedureLog;
                                if (data.milestones) this.milestones = data.milestones;
                                this.saveData();
                                renderApp();
                                alert('Backup restored successfully!');
                            }
                        } catch (err) {
                            alert('Failed to restore backup: Invalid file format.');
                            console.error('Import error:', err);
                        }
                    };
                    reader.readAsText(file);
                };
                input.click();
            }

            setTab(tab) {
                this.activeTab = tab;
                if (window.innerWidth <= 768) toggleSidebar();
                window.scrollTo(0, 0); // Only scroll to top on tab change
                this.notify();
            }

            updateModuleData(moduleId, type, id, value) {
                if (type === 'week') {
                    if (!this.modules[moduleId].weeks[id]) this.modules[moduleId].weeks[id] = {};
                    if (typeof value === 'object') this.modules[moduleId].weeks[id] = { ...this.modules[moduleId].weeks[id], ...value };
                    else this.modules[moduleId].weeks[id].status = value;
                } else if (type === 'assignment') {
                    if (!this.modules[moduleId].assignments[id]) this.modules[moduleId].assignments[id] = {};
                    this.modules[moduleId].assignments[id] = { ...this.modules[moduleId].assignments[id], ...value };
                } else if (type === 'caseReport') {
                    this.modules[moduleId].caseReports[id] = value;
                }
                this.saveData();
            }

            addRotation(moduleId) {
                if (!this.modules[moduleId].rotations) this.modules[moduleId].rotations = [];
                this.modules[moduleId].rotations.push({ location: '', startDate: '', endDate: '' });
                this.saveData();
            }

            updateRotation(moduleId, index, field, value) {
                if (!this.modules[moduleId].rotations) return;
                this.modules[moduleId].rotations[index][field] = value;
                this.saveData();
            }

            deleteRotation(moduleId, index) {
                if (!this.modules[moduleId].rotations) return;
                if (confirm('Delete this rotation entry?')) {
                    this.modules[moduleId].rotations.splice(index, 1);
                    this.saveData();
                }
            }

            addProcedure(data) {
                const entry = { ...data, id: crypto.randomUUID(), timestamp: Date.now() };
                this.procedureLog.push(entry);
                this.saveData();
                // Sync to Firestore subcollection
                if (this.account?.id && window.db) {
                    window.db.collection('users').doc(this.account.id)
                        .collection('procedureLogs').doc(entry.id).set(entry)
                        .catch(e => console.error('Subcollection add error:', e));
                }
            }

            updateMilestone(category, id, value, date) {
                if (!this.milestones[category]) this.milestones[category] = {};
                this.milestones[category][id] = { status: value, date: date };
                this.saveData();
            }

            notify() { this.listeners.forEach(l => l()); }
            subscribe(l) { this.listeners.push(l); }
        }

        const state = new AppState();

        // HTML escape utility to prevent XSS
        function esc(str) {
            const el = document.createElement('span');
            el.textContent = str || '';
            return el.innerHTML;
        }

        // --- 4. UI RENDERING FUNCTIONS ---

        function renderSidebarLinks() {
            const container = document.getElementById('module-nav-links');
            container.innerHTML = moduleConfigs.map(m => `
                <button onclick="state.setTab('${m.id}')" id="tab-${m.id}" class="nav-tab-btn w-full flex items-center gap-3 px-3 py-2 transition-colors text-sm text-left truncate">
                    <div class="w-2.5 h-2.5 rounded-full ${m.color}"></div>
                    <span class="truncate">${m.name.split(' (')[0]}</span>
                </button>
            `).join('');

            // Highlight active tab — only target nav-tab-btn
            document.querySelectorAll('.nav-tab-btn').forEach(btn => {
                btn.classList.remove('bg-slate-200/60', 'text-blue-700', 'font-bold', 'shadow-[inset_0_1px_2px_rgba(0,0,0,0.02)]');
                btn.classList.add('hover:bg-slate-200/40', 'text-slate-600', 'font-medium');
                if (btn.id === `tab-${state.activeTab}`) {
                    btn.classList.remove('hover:bg-slate-200/40', 'text-slate-600', 'font-medium');
                    btn.classList.add('bg-slate-200/60', 'text-blue-700', 'font-bold', 'shadow-[inset_0_1px_2px_rgba(0,0,0,0.02)]');
                }
            });

            // Sync desktop top bar title
            const titleEl = document.getElementById('top-bar-title');
            if (titleEl) {
                const tab = state.activeTab;
                if (tab === 'dashboard') titleEl.textContent = 'Dashboard';
                else if (tab === 'master_logbook') titleEl.textContent = 'Master Logbook';
                else if (tab === 'milestones') titleEl.textContent = 'Milestones & Courses';
                else {
                    const mod = moduleConfigs.find(m => m.id === tab);
                    titleEl.textContent = mod ? mod.name : 'Portfolio';
                }
            }
        }

        function renderDashboard() {
            const totalProcedures = state.procedureLog.length;
            const totalModuleProcs = state.procedureLog.filter(p => p.logType !== 'daily' && !p.isOther).length;
            const targetProcedures = moduleConfigs.reduce((acc, m) => acc + (m.requiredProcedures ? m.requiredProcedures.reduce((a, p) => a + p.target, 0) : 0), 0);
            const totalAssignments = Object.values(state.modules).reduce((acc, m) => acc + (m.assignments ? Object.values(m.assignments).filter(a => a.dateSubmitted).length : 0), 0);
            const targetAssignments = moduleConfigs.reduce((acc, m) => acc + (m.assignmentList ? m.assignmentList.length : 0), 0);

            const partText = state.account.year <= 3 ? 'Part 1' : 'Part 2';

            // Pending assignments
            const pendingAssignments = [];
            moduleConfigs.forEach(m => {
                if (!m.assignmentList) return;
                const modData = state.modules[m.id] || {};
                m.assignmentList.forEach((a, i) => {
                    const title = typeof a === 'string' ? a : a.title;
                    const isDone = modData.assignments?.[`${m.id}_assign_${i}`]?.dateSubmitted;
                    if (!isDone) pendingAssignments.push({ module: m.name.split(' (')[0], title });
                });
            });

            // Procedures near target
            const nearTarget = [];
            moduleConfigs.forEach(m => {
                if (!m.requiredProcedures) return;
                m.requiredProcedures.forEach(req => {
                    const count = state.procedureLog.filter(p => p.moduleId === m.id && p.procedure === req.name && p.logType !== 'daily' && !p.isOther).length;
                    const pct = count / req.target;
                    if (pct >= 0.5 && pct < 1) nearTarget.push({ module: m.name.split(' (')[0], name: req.name, count, target: req.target });
                });
            });

            return `
                <div class="mb-6 no-print">
                    <p class="text-slate-500 text-sm font-medium">MMed (Rural) · Year ${state.account.year} · <span class="text-blue-600">${partText}</span> · ${esc(state.account.location) || 'No location set'}</p>
                    <button onclick="document.getElementById('profile-panel').classList.toggle('hidden')" class="text-xs text-blue-500 hover:text-blue-600 mt-1 font-medium flex items-center gap-1 transition-colors">
                        <i class="fas fa-pen text-[10px]"></i> Edit profile
                    </button>
                </div>

                <!-- Collapsible Profile Panel -->

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-5">

                            <label class="block text-xs font-semibold text-slate-500 mb-1.5 uppercase tracking-wider">Name</label>
                            <input type="text" value="${esc(state.account.name || '')}" onchange="state.account.name=this.value; state.saveData();" class="w-full bg-slate-50 border-0 rounded-xl px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500/20 transition-all text-slate-900">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-1.5 uppercase tracking-wider">Current year</label>
                            <select onchange="state.account.year=parseInt(this.value); state.saveData(); renderApp();" class="w-full bg-slate-50 border-0 rounded-xl px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500/20 transition-all text-slate-900">
                                ${[1, 2, 3, 4, 5, 6].map(y => `<option value="${y}" ${state.account.year === y ? 'selected' : ''}>Year ${y}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-1.5 uppercase tracking-wider">Current hospital</label>
                            <input type="text" placeholder="e.g. Kundiawa" value="${esc(state.account.location || '')}" onchange="state.account.location=this.value; state.saveData();" class="w-full bg-slate-50 border-0 rounded-xl px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500/20 transition-all text-slate-900">
                        </div>

                    </div>
                    <div class="flex items-baseline gap-2">
                        <span class="text-4xl font-bold tabular-nums text-slate-900 tracking-tight">${totalAssignments}</span>

                    </div>
                </div>

                <!-- Next Actions -->
                ${(pendingAssignments.length > 0 || nearTarget.length > 0) ? `
                <div class="rounded-2xl shadow-sm mb-8 overflow-hidden bg-white">

                        <h3 class="text-base font-bold text-slate-900 tracking-tight">Up Next</h3>

                                <div class="flex items-center gap-3.5">
                                    <div class="w-7 h-7 rounded-full bg-blue-50 text-blue-500 flex items-center justify-center shrink-0"><i class="fas fa-bullseye text-[11px]"></i></div>

        function renderMilestones() {

                            <div class="divide-y divide-slate-100">
                                ${milestoneConfigs[cat].map(m => {
                const mData = state.milestones[cat] && state.milestones[cat][m.id] ? state.milestones[cat][m.id] : {};
                const isDone = mData.status === 'Done' || mData.status === 'Passed';
                return `
                                        <div class="p-5 flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4 transition-colors ${isDone ? 'bg-blue-50/30' : 'hover:bg-slate-50/50'}">
                                            <span class="font-semibold text-sm ${isDone ? 'text-blue-900 text-opacity-80' : 'text-slate-900'}">${m.label}</span>
                                            <div class="flex items-center gap-3">
                                                <select onchange="state.updateMilestone('${cat}','${m.id}',this.value, this.nextElementSibling.value)" class="border-0 rounded-xl px-4 py-2.5 text-sm font-medium outline-none focus:ring-2 focus:ring-blue-500/20 shadow-sm transition-all ${isDone ? 'bg-blue-100 text-blue-800 border-none' : 'bg-slate-50 text-slate-600 border border-black/5 hover:bg-slate-100'}">
                                                    <option value="Not Started" ${!isDone ? 'selected' : ''}>Pending</option>
                                                    <option value="${cat === 'exams' ? 'Passed' : 'Done'}" ${isDone ? 'selected' : ''}>${cat === 'exams' ? 'Passed' : 'Done'}</option>
                                                </select>
                                                <input type="date" value="${mData.date || ''}" onchange="state.updateMilestone('${cat}','${m.id}',this.previousElementSibling.value,this.value)" class="border border-black/5 shadow-sm rounded-xl px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500/20 bg-slate-50 text-slate-600 hover:bg-slate-100 transition-all">
                                            </div>
                                        </div>
                                    `;
            }).join('')}
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function renderMasterLogbook() {
            return `
                <div class="flex justify-between items-end mb-8 no-print">
                    <div>
                        <h1 class="text-3xl font-bold text-slate-900 tracking-tight">Master Logbook</h1>
                        <p class="text-slate-500 mt-2 text-sm">Graduation requirements combined from all modules.</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <button onclick="toggleAllSections(this)" class="text-sm font-medium text-blue-500 hover:text-blue-600 bg-white shadow-sm border border-black/5 rounded-xl px-4 py-2 transition-colors flex items-center gap-2 shrink-0">
                            <i class="fas fa-compress-alt text-xs"></i>
                            <span>Collapse</span>
                        </button>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    ${moduleConfigs.map(m => {
                const hasProcedures = m.requiredProcedures && m.requiredProcedures.length > 0;
                const otherLogs = state.procedureLog.filter(p => p.moduleId === m.id && (p.logType === 'daily' || p.isOther));
                const otherGroups = {};
                otherLogs.forEach(p => {
                    if (!otherGroups[p.procedure]) otherGroups[p.procedure] = 0;
                    otherGroups[p.procedure]++;
                });

                // For modules with required procedures, calculate progress
                const metCount = hasProcedures ? m.requiredProcedures.filter(req => state.procedureLog.filter(p => p.moduleId === m.id && p.procedure === req.name).length >= req.target).length : 0;
                const totalReq = hasProcedures ? m.requiredProcedures.length : 0;
                const pctMet = totalReq > 0 ? Math.round((metCount / totalReq) * 100) : 0;

                // For modules without procedures, count completed assignments & case reports
                const modData = state.modules[m.id] || { assignments: {}, caseReports: {} };
                const assignments = m.assignmentList || [];
                const caseReports = m.caseReports || [];
                const completedAssignments = assignments.filter((a, i) => modData.assignments && modData.assignments[i] && modData.assignments[i].status === 'Done').length;
                const completedCases = caseReports.filter((c, i) => modData.caseReports && modData.caseReports[i] && modData.caseReports[i].status === 'Done').length;
                const totalItems = hasProcedures ? totalReq : (assignments.length + caseReports.length);
                const doneItems = hasProcedures ? metCount : (completedAssignments + completedCases);
                const pctDone = totalItems > 0 ? Math.round((doneItems / totalItems) * 100) : 0;

                return `
                    <div class="bg-white rounded-[2rem] shadow-[0_4px_20px_-4px_rgba(0,0,0,0.03)] border border-black/5 break-inside-avoid overflow-hidden">
                        <button onclick="toggleSection(this)" data-section-toggle class="w-full px-5 py-4 flex items-center justify-between cursor-pointer hover:bg-slate-50 transition-colors border-b border-black/5 bg-white text-left outline-none">
                            <div class="flex items-center gap-3">
                                <h3 class="font-bold text-slate-900 tracking-tight text-base ${m.text}">${m.name}</h3>
                                <i class="fas fa-chevron-down text-slate-400 text-xs section-chevron transition-transform duration-200"></i>
                            </div>
                            <div class="flex items-center gap-3">
                                <div class="w-16 bg-slate-100 rounded-full h-1.5 overflow-hidden">
                                    <div class="h-1.5 rounded-full ${doneItems === totalItems && totalItems > 0 ? 'bg-green-500' : 'bg-blue-500'}" style="width: ${pctDone}%"></div>
                                </div>
                                <span class="text-xs font-semibold tabular-nums px-2.5 py-1 rounded-lg border border-black/5 bg-slate-50 ${doneItems === totalItems && totalItems > 0 ? 'text-green-700 bg-green-50/50' : 'text-slate-600'}">${doneItems} / ${totalItems}</span>
                            </div>
                        </button>
                        <div class="p-5">
                            <div class="space-y-4">
                                ${hasProcedures ? m.requiredProcedures.map(req => {
                    const count = state.procedureLog.filter(p => p.moduleId === m.id && p.procedure === req.name).length;
                    const isDone = count >= req.target;
                    const pct = Math.min(100, Math.round((count / req.target) * 100));
                    return `
                                    <div class="text-sm ${count === 0 ? 'print-hide-zero' : ''}">
                                        <div class="flex justify-between items-center mb-1.5">
                                            <span class="font-semibold ${isDone ? 'text-green-700' : 'text-slate-900'}">${isDone ? '<i class="fas fa-check-circle text-green-500 mr-1.5 text-xs"></i>' : ''}${req.name}</span>
                                            <span class="font-bold tabular-nums ${isDone ? 'text-green-600' : 'text-slate-400'} w-12 text-right">${count} / ${req.target}</span>
                                        </div>
                                        <div class="w-full bg-slate-100 rounded-full h-1.5 no-print overflow-hidden">
                                            <div class="h-1.5 rounded-full ${isDone ? 'bg-green-500' : 'bg-blue-500'}" style="width: ${pct}%"></div>
                                        </div>
                                    </div>
                                `;
                }).join('') : `
                                ${assignments.length > 0 ? `
                                    <div>
                                        <div class="flex items-center gap-2 mb-3">
                                            <span class="px-2 py-0.5 text-[10px] uppercase font-bold tracking-wide rounded bg-blue-50 text-blue-600 border border-blue-200/60"><i class="fas fa-file-alt mr-1"></i>Assignments</span>
                                            <span class="text-xs font-medium tabular-nums text-slate-400">${completedAssignments} / ${assignments.length}</span>
                                        </div>
                                        ${assignments.map((a, i) => {
                    const aData = modData.assignments && modData.assignments[i] ? modData.assignments[i] : {};
                    const aIsDone = aData.status === 'Done';
                    return `
                                        <div class="text-sm flex justify-between items-center py-1.5">
                                            <span class="font-medium ${aIsDone ? 'text-green-700' : 'text-slate-700'}">${aIsDone ? '<i class="fas fa-check-circle text-green-500 mr-1.5 text-xs"></i>' : '<i class="far fa-circle text-slate-300 mr-1.5 text-xs"></i>'}${esc(a.title)}</span>
                                        </div>`;
                }).join('')}
                                    </div>
                                ` : ''}
                                ${caseReports.length > 0 ? `
                                    <div class="${assignments.length > 0 ? 'mt-4 pt-3 border-t border-slate-100' : ''}">
                                        <div class="flex items-center gap-2 mb-3">
                                            <span class="px-2 py-0.5 text-[10px] uppercase font-bold tracking-wide rounded bg-purple-50 text-purple-600 border border-purple-200/60"><i class="fas fa-clipboard-list mr-1"></i>Case Reports</span>
                                            <span class="text-xs font-medium tabular-nums text-slate-400">${completedCases} / ${caseReports.length}</span>
                                        </div>
                                        ${caseReports.map((c, i) => {
                    const cData = modData.caseReports && modData.caseReports[i] ? modData.caseReports[i] : {};
                    const cIsDone = cData.status === 'Done';
                    return `
                                        <div class="text-sm flex justify-between items-center py-1.5">
                                            <span class="font-medium ${cIsDone ? 'text-green-700' : 'text-slate-700'}">${cIsDone ? '<i class="fas fa-check-circle text-green-500 mr-1.5 text-xs"></i>' : '<i class="far fa-circle text-slate-300 mr-1.5 text-xs"></i>'}${esc(typeof c === 'string' ? c : c.title || c.name)}</span>
                                        </div>`;
                }).join('')}
                                    </div>
                                ` : ''}
                                ${assignments.length === 0 && caseReports.length === 0 ? '<p class="text-sm text-slate-400 italic">No tracked items for this module.</p>' : ''}
                                `}
                            </div>
                        </div>
                    </div>
                `;
            }).join('')}
                </div>

                ${(() => {
                    const allDailyLogs = state.procedureLog.filter(p => p.logType === 'daily' || p.isOther);
                    if (allDailyLogs.length === 0) return '';
                    const dailyGroups = {};
                    allDailyLogs.forEach(p => {
                        if (!dailyGroups[p.procedure]) dailyGroups[p.procedure] = 0;
                        dailyGroups[p.procedure]++;
                    });
                    const sortedEntries = Object.entries(dailyGroups).sort((a, b) => b[1] - a[1]);
                    return `
                    <div class="mt-8">
                        <div class="bg-white rounded-[2rem] shadow-[0_4px_20px_-4px_rgba(0,0,0,0.03)] border border-black/5 overflow-hidden">
                            <button onclick="toggleSection(this)" data-section-toggle class="w-full px-5 py-4 flex items-center justify-between cursor-pointer hover:bg-slate-50 transition-colors border-b border-black/5 bg-white text-left outline-none">
                                <div class="flex items-center gap-3">
                                    <h3 class="font-bold text-slate-900 tracking-tight text-base text-amber-600"><i class="fas fa-clipboard-list text-amber-500 mr-2"></i>Daily Activity Log</h3>
                                    <i class="fas fa-chevron-down text-slate-400 text-xs section-chevron transition-transform duration-200"></i>
                                </div>
                                <span class="text-xs font-semibold tabular-nums px-2.5 py-1 rounded-lg border border-black/5 bg-amber-50/50 text-amber-700">${allDailyLogs.length} entries</span>
                            </button>
                            <div class="p-5">
                                <div class="space-y-3">
                                    ${sortedEntries.map(([name, cnt]) => `
                                        <div class="text-sm flex justify-between items-center py-1.5">
                                            <span class="font-semibold text-slate-900">${esc(name)}</span>
                                            <span class="font-bold tabular-nums text-amber-600 bg-amber-50 px-2 py-0.5 rounded-lg">${cnt}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                    `;
                })()}
            `;
        }

        function renderModuleDetail(moduleId) {
            const config = moduleConfigs.find(m => m.id === moduleId);
            const data = state.modules[moduleId] || { assignments: {}, weeks: {}, caseReports: {} };
            const logs = state.procedureLog.filter(p => p.moduleId === moduleId);

            return `
                <div class="${config.color} rounded-[2rem] p-8 text-white mb-8 shadow-sm">
                    <h1 class="text-3xl font-bold tracking-tight">${config.name}</h1>
                    <div class="flex gap-5 mt-3 text-white/90 text-sm font-medium">
                        <span class="flex items-center gap-2 bg-white/10 px-3 py-1.5 rounded-lg backdrop-blur-sm"><i class="far fa-clock"></i> ${config.duration}</span>
                        ${config.requiredProcedures ? `<span class="flex items-center gap-2 bg-white/10 px-3 py-1.5 rounded-lg backdrop-blur-sm"><i class="fas fa-notes-medical"></i> ${config.requiredProcedures.reduce((a, r) => a + r.target, 0)} Required</span>` : ''}
                    </div>
                </div>

                <div class="flex justify-end mb-6 no-print">
                    <button onclick="toggleAllSections(this)" class="text-sm font-medium text-blue-500 hover:text-blue-600 bg-white shadow-sm border border-black/5 rounded-xl px-4 py-2 transition-colors flex items-center gap-2">
                        <i class="fas fa-compress-alt text-xs"></i>
                        <span>Collapse All</span>
                    </button>
                </div>

                ${(() => {
                    const rotations = (data.rotations || []).map((r, i) => ({ ...r, _idx: i }));
                    const today = new Date().toISOString().split('T')[0];
                    const activeRotations = rotations.filter(r => !r.endDate || r.endDate >= today);
                    const completedRotations = rotations.filter(r => r.endDate && r.endDate < today)
                        .sort((a, b) => (b.endDate || '').localeCompare(a.endDate || ''));

                    const calcDuration = (start, end) => {
                        if (!start || !end) return '';
                        const s = new Date(start);
                        const e = new Date(end);
                        const diffMs = e - s;
                        if (diffMs <= 0) return '';
                        const days = Math.ceil(diffMs / (1000 * 60 * 60 * 24));
                        if (days < 7) return days + ' day' + (days !== 1 ? 's' : '');
                        const weeks = Math.round(days / 7);
                        if (weeks < 5) return weeks + ' week' + (weeks !== 1 ? 's' : '');
                        const months = Math.round(days / 30.44);
                        return months + ' month' + (months !== 1 ? 's' : '');
                    };

                    const renderRotationCard = (r, isCompleted) => {
                        const duration = calcDuration(r.startDate, r.endDate);
                        return `
                        <div class="p-5 rounded-2xl border ${isCompleted ? 'border-green-200 bg-green-50/50' : 'border-black/5 bg-slate-50'} relative group transition-colors shadow-sm">
                            <button onclick="state.deleteRotation('${moduleId}', ${r._idx})" class="absolute top-3 right-3 text-rose-400 hover:text-rose-600 opacity-0 group-hover:opacity-100 transition-opacity w-8 h-8 flex items-center justify-center rounded-full hover:bg-rose-50" title="Delete rotation">
                                <i class="fas fa-trash text-xs"></i>
                            </button>
                            ${isCompleted ? '<div class="flex items-center gap-2 mb-3"><i class="fas fa-check-circle text-green-500 text-sm"></i><span class="text-[10px] font-bold text-green-700 uppercase tracking-widest">Completed</span></div>' : ''}
                            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                                <div class="md:col-span-1">
                                    <label class="block text-[10px] font-bold ${isCompleted ? 'text-green-600' : 'text-slate-500'} uppercase tracking-wider mb-1.5"><i class="fas fa-hospital mr-1.5 opacity-70"></i>Hospital</label>
                                    <input type="text" value="${esc(r.location || '')}" onchange="state.updateRotation('${moduleId}', ${r._idx}, 'location', this.value)" placeholder="e.g. Port Moresby" class="w-full text-sm border-0 bg-white shadow-sm rounded-xl px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500/20 transition-all text-slate-900">
                                </div>
                                <div>
                                    <label class="block text-[10px] font-bold ${isCompleted ? 'text-green-600' : 'text-slate-500'} uppercase tracking-wider mb-1.5"><i class="fas fa-calendar-alt mr-1.5 opacity-70"></i>Start Date</label>
                                    <input type="date" value="${r.startDate || ''}" onchange="state.updateRotation('${moduleId}', ${r._idx}, 'startDate', this.value)" class="w-full text-sm border-0 bg-white shadow-sm rounded-xl px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500/20 transition-all text-slate-900">
                                </div>
                                <div>
                                    <label class="block text-[10px] font-bold ${isCompleted ? 'text-green-600' : 'text-slate-500'} uppercase tracking-wider mb-1.5"><i class="fas fa-calendar-check mr-1.5 opacity-70"></i>End Date</label>
                                    <input type="date" value="${r.endDate || ''}" onchange="state.updateRotation('${moduleId}', ${r._idx}, 'endDate', this.value)" class="w-full text-sm border-0 bg-white shadow-sm rounded-xl px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500/20 transition-all text-slate-900">
                                </div>
                                <div class="flex items-end">
                                    ${duration ? `<span class="text-sm font-bold ${isCompleted ? 'text-green-700 bg-green-100/50' : 'text-blue-700 bg-blue-50'} rounded-xl px-4 py-2 w-full text-center shadow-sm"><i class="fas fa-clock mr-2 opacity-70"></i>${duration}</span>` : '<span class="text-xs text-slate-400 italic py-2">Enter dates for duration</span>'}
                                </div>
                            </div>
                        </div>`;
                    };

                    return `
                    <div class="bg-white rounded-[2rem] shadow-[0_4px_20px_-4px_rgba(0,0,0,0.03)] border border-black/5 mb-8 no-print overflow-hidden">
                        <button onclick="toggleSection(this)" data-section-toggle class="w-full px-6 py-5 border-b border-black/5 bg-white flex justify-between items-center cursor-pointer hover:bg-slate-50 transition-colors outline-none">
                            <div class="flex items-center gap-3">
                                <h3 class="text-base font-bold text-slate-900 tracking-tight"><i class="fas fa-map-marker-alt text-blue-500 mr-2"></i>Rotation / Placement</h3>
                                <i class="fas fa-chevron-down text-slate-400 text-xs section-chevron transition-transform duration-200"></i>
                            </div>
                            <span class="text-xs font-semibold px-2.5 py-1 rounded-lg border border-black/5 bg-slate-50 text-slate-500">${rotations.length} rotation${rotations.length !== 1 ? 's' : ''}</span>
                        </button>
                        <div class="p-6">
                            ${activeRotations.length > 0 ? `
                                <div class="space-y-4 mb-5">
                                    ${activeRotations.map(r => renderRotationCard(r, false)).join('')}
                                </div>
                            ` : rotations.length === 0 ? '<p class="text-sm text-slate-400 text-center py-4 mb-4">No rotations added yet. Click below to add your first rotation.</p>' : ''}

                            ${completedRotations.length > 0 ? `
                                <div class="border-t border-black/5 pt-5 mb-5">
                                    <button onclick="toggleSection(this)" data-section-toggle class="w-full flex items-center gap-3 py-2 cursor-pointer hover:bg-slate-50 rounded-xl px-3 transition-colors outline-none section-collapsed">
                                        <i class="fas fa-chevron-down text-slate-400 text-xs section-chevron transition-transform duration-200"></i>
                                        <span class="text-sm font-bold text-slate-700"><i class="fas fa-history mr-1.5 opacity-70"></i> Completed Rotations</span>
                                        <span class="text-xs font-semibold px-2.5 py-1 rounded-lg border border-black/5 bg-slate-50 text-slate-500">${completedRotations.length}</span>
                                    </button>
                                    <div style="display:none" class="space-y-4 mt-4">
                                        ${completedRotations.map(r => renderRotationCard(r, true)).join('')}
                                    </div>
                                </div>
                            ` : ''}

                            <button onclick="state.addRotation('${moduleId}')" class="w-full py-3.5 border border-dashed border-black/10 rounded-2xl text-slate-500 hover:border-blue-400 hover:text-blue-600 hover:bg-blue-50/50 transition-all text-sm font-bold shadow-sm">
                                <i class="fas fa-plus mr-2"></i> Add Rotation
                            </button>
                        </div>
                    </div>
                `;
                })()}

                <!-- Documents Section -->
                <div class="bg-white rounded-[2rem] shadow-[0_4px_20px_-4px_rgba(0,0,0,0.03)] border border-black/5 mb-8 no-print overflow-hidden">
                    <button onclick="toggleSection(this)" data-section-toggle class="w-full px-6 py-5 border-b border-black/5 bg-white flex justify-between items-center cursor-pointer hover:bg-slate-50 transition-colors outline-none">
                        <div class="flex items-center gap-3">
                            <h3 class="text-base font-bold text-slate-900 tracking-tight"><i class="fas fa-folder-open text-orange-500 mr-2"></i>Documents</h3>
                            <i class="fas fa-chevron-down text-slate-400 text-xs section-chevron transition-transform duration-200"></i>
                        </div>
                        <span id="doc-count-${moduleId}" class="text-xs font-semibold px-2.5 py-1 rounded-lg border border-black/5 bg-slate-50 text-slate-500">...</span>
                    </button>
                    <div class="p-6">
                        <!-- Upload Zone -->
                        <div id="drop-zone-${moduleId}" class="border border-dashed border-black/10 rounded-2xl p-6 text-center mb-5 hover:border-blue-400 hover:bg-blue-50/30 transition-all cursor-pointer shadow-sm"
                            ondragover="event.preventDefault(); this.classList.add('border-blue-400','bg-blue-50');"
                            ondragleave="this.classList.remove('border-blue-400','bg-blue-50');"
                            ondrop="event.preventDefault(); this.classList.remove('border-blue-400','bg-blue-50'); handleDocUpload(event.dataTransfer.files, '${moduleId}');"
                            onclick="document.getElementById('file-input-${moduleId}').click()">
                            <input type="file" id="file-input-${moduleId}" class="hidden" multiple accept=".pdf,.jpg,.jpeg,.png,.doc,.docx" onchange="handleDocUpload(this.files, '${moduleId}'); this.value=''">
                            <div id="upload-status-${moduleId}">
                                <i class="fas fa-cloud-upload-alt text-3xl text-blue-300 mb-3"></i>
                                <p class="text-sm font-bold text-slate-700">Drop files here or <span class="text-blue-600 hover:underline">browse</span></p>
                                <p class="text-xs text-slate-400 mt-1.5 font-medium">PDF, JPG, PNG, DOC — Max 10MB per file</p>
                            </div>
                        </div>
                        ${!state.driveToken ? '<div class="text-center text-sm text-blue-700 bg-blue-50 border border-blue-100 rounded-xl p-3 mb-5 font-medium shadow-sm"><i class="fas fa-info-circle mr-2 text-blue-500"></i>Sign in with Google to enable document uploads to Drive.</div>' : ''}
                        <!-- File List -->
                        <div id="doc-list-${moduleId}" class="space-y-3">
                            <div class="text-center text-sm font-medium text-slate-400 py-4"><i class="fas fa-spinner fa-spin mr-2"></i>Loading documents...</div>
                        </div>
                    </div>
                </div>

                <div class="flex justify-end mb-6 no-print">
                    <button id="collapse-all-btn" onclick="toggleAllSections(this)" class="text-sm font-medium text-blue-500 hover:text-blue-600 bg-white shadow-sm border border-black/5 rounded-xl px-4 py-2 transition-colors flex items-center gap-2">
                        <i class="fas fa-compress-alt text-xs"></i>
                        <span>Collapse All</span>
                    </button>
                </div>

                ${config.weeks ? (() => {
                    const completedCount = config.weeks.filter(w => ((data.weeks && data.weeks[w.id]) || {}).status === 'Completed').length;
                    const totalWeeks = config.weeks.length;
                    const pctWeeks = Math.round((completedCount / totalWeeks) * 100);
                    const activeWeeks = config.weeks.filter(w => ((data.weeks && data.weeks[w.id]) || {}).status !== 'Completed');
                    const doneWeeks = config.weeks.filter(w => ((data.weeks && data.weeks[w.id]) || {}).status === 'Completed')
                        .sort((a, b) => {
                            const dA = (data.weeks && data.weeks[a.id])?.completeDate || '';
                            const dB = (data.weeks && data.weeks[b.id])?.completeDate || '';
                            return dB.localeCompare(dA);
                        });

                    const renderWeekRow = (w) => {
                        const wData = (data.weeks && data.weeks[w.id]) || {};
                        const wStatus = wData.status || 'Not Started';
                        const statusBadge = wStatus === 'Completed' ? 'bg-green-100 text-green-700' : wStatus === 'Pending' ? 'bg-orange-100 text-orange-700' : 'bg-slate-100 text-slate-500';
                        const rowBg = wStatus === 'Completed' ? 'bg-green-50/50' : '';
                        return `
                            <div class="${rowBg}">
                                <button onclick="this.nextElementSibling.classList.toggle('hidden'); this.querySelector('.chevron').classList.toggle('rotate-90')"
                                    class="w-full flex items-center justify-between px-6 py-4 hover:bg-slate-50 transition-colors text-left border-b border-transparent hover:border-slate-50 outline-none">

        function getFileIcon(mimeType) {
            if (mimeType?.includes('pdf')) return '<i class="fas fa-file-pdf text-red-500"></i>';
            if (mimeType?.includes('image')) return '<i class="fas fa-file-image text-blue-500"></i>';
            if (mimeType?.includes('word') || mimeType?.includes('document')) return '<i class="fas fa-file-word text-blue-600"></i>';
            return '<i class="fas fa-file text-slate-400"></i>';
        }

        function formatFileSize(bytes) {
            if (!bytes) return '';
            bytes = parseInt(bytes);
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1048576).toFixed(1) + ' MB';
        }

        async function handleDocUpload(files, moduleId) {
            if (!state.driveToken) { alert('Please sign in with Google to upload documents.'); return; }
            const statusEl = document.getElementById(`upload-status-${moduleId}`);
            const maxSize = 10 * 1024 * 1024; // 10MB
            const allowed = ['application/pdf', 'image/jpeg', 'image/png', 'image/jpg', 'application/msword', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'];

            for (const file of files) {
                if (file.size > maxSize) { alert(`${file.name} is too large (${formatFileSize(file.size)}). Max 10MB.`); continue; }
                // Exact MIME match, or image/* prefix. Fallback to extension check.
                const mimeOk = allowed.includes(file.type) || file.type.startsWith('image/');
                if (!mimeOk) {
                    const ext = file.name.split('.').pop().toLowerCase();
                    if (!['pdf', 'jpg', 'jpeg', 'png', 'doc', 'docx'].includes(ext)) { alert(`${file.name} is not a supported file type.`); continue; }
                }
                // Show uploading state
                if (statusEl) statusEl.innerHTML = `<i class="fas fa-spinner fa-spin text-3xl text-teal-400 mb-2"></i><p class="text-sm font-semibold text-teal-600">Uploading ${esc(file.name)}...</p>`;

                const result = await state.uploadToDrive(file, moduleId);
                if (result) {
                    console.log('Uploaded:', result);
                } else {
                    alert(`Failed to upload ${file.name}. Please try again.`);
                }
            }
            // Reset upload zone
            if (statusEl) statusEl.innerHTML = `<i class="fas fa-cloud-upload-alt text-3xl text-slate-300 mb-2"></i><p class="text-sm font-semibold text-slate-500">Drop files here or <span class="text-teal-600 underline">browse</span></p><p class="text-xs text-slate-400 mt-1">PDF, JPG, PNG, DOC — Max 10MB per file</p>`;
            // Refresh file list
            loadDocList(moduleId);
        }

                        <button onclick="event.stopPropagation(); deleteDocFile('${f.id}', '${moduleId}')" class="text-rose-400 hover:text-rose-600 text-sm px-2 py-1 rounded hover:bg-rose-50" title="Delete"><i class="fas fa-trash"></i></button>

        // --- RFC 4180 quote-aware CSV line parser ---
        function parseCsvLine(line) {
            const fields = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const ch = line[i];
                if (inQuotes) {
                    if (ch === '"') {
                        if (i + 1 < line.length && line[i + 1] === '"') {
                            current += '"';
                            i++; // skip escaped quote
                        } else {
                            inQuotes = false;
                        }
                    } else {
                        current += ch;
                    }
                } else {
                    if (ch === '"') {
                        inQuotes = true;
                    } else if (ch === ',') {
                        fields.push(current.trim());
                        current = '';
                    } else {
                        current += ch;
                    }
                }
            }
            fields.push(current.trim());
            return fields;
        }

        function isValidIsoDate(str) {
            return /^\d{4}-\d{2}-\d{2}$/.test(str) && !isNaN(new Date(str).getTime());
        }

        let _csvParsedRows = [];

        function previewCsvImport(file, moduleId) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (e) {
                const lines = e.target.result.split(/\r?\n/).filter(l => l.trim());
                if (lines.length < 2) { alert('CSV file is empty or has no data rows.'); return; }
                const headers = parseCsvLine(lines[0]).map(h => h.toLowerCase());
                const dateIdx = headers.findIndex(h => h === 'date');
                const procIdx = headers.findIndex(h => h.includes('procedure') || h.includes('proc'));
                const locIdx = headers.findIndex(h => h.includes('location') || h.includes('hospital'));
                const supIdx = headers.findIndex(h => h.includes('supervisor') || h.includes('sup'));

                if (dateIdx === -1 || procIdx === -1) { alert('CSV must have at least "Date" and "Procedure" columns.'); return; }

                const config = moduleConfigs.find(m => m.id === moduleId);
                _csvParsedRows = [];
                let skipped = 0;
                let tableHtml = '<table class="w-full text-xs"><thead class="bg-slate-50 sticky top-0"><tr><th class="px-3 py-2 text-left">Date</th><th class="px-3 py-2 text-left">Procedure</th><th class="px-3 py-2 text-left">Location</th><th class="px-3 py-2 text-left">Supervisor</th><th class="px-3 py-2">Match</th></tr></thead><tbody>';

                for (let i = 1; i < lines.length; i++) {
                    const cols = parseCsvLine(lines[i]);
                    const row = {
                        date: cols[dateIdx] || '',
                        procedure: cols[procIdx] || '',
                        location: locIdx !== -1 ? (cols[locIdx] || '') : '',
                        supervisor: supIdx !== -1 ? (cols[supIdx] || '') : '',
                        moduleId: moduleId
                    };
                    if (!row.date || !row.procedure) continue;
                    // Validate ISO date format
                    if (!isValidIsoDate(row.date)) { skipped++; continue; }
                    const isKnown = config?.requiredProcedures?.some(r => r.name === row.procedure);
                    row.isOther = !isKnown;
                    _csvParsedRows.push(row);
                    tableHtml += `<tr class="border-t border-slate-100"><td class="px-3 py-2">${esc(row.date)}</td><td class="px-3 py-2 font-medium">${esc(row.procedure)}</td><td class="px-3 py-2">${esc(row.location)}</td><td class="px-3 py-2">${esc(row.supervisor)}</td><td class="px-3 py-2 text-center">${isKnown ? '<i class="fas fa-check-circle text-green-500"></i>' : '<span class="text-xs text-amber-600 font-bold">Daily</span>'}</td></tr>`;
                }
                tableHtml += '</tbody></table>';

                document.getElementById('csv-preview').classList.remove('hidden');
                document.getElementById('csv-preview-table').innerHTML = tableHtml;
                document.getElementById('csv-row-count').textContent = `${_csvParsedRows.length} entries ready to import` + (skipped ? ` (${skipped} skipped — invalid date)` : '');
                document.getElementById('csv-import-btn').onclick = () => executeCsvImport(moduleId);
            };
            reader.readAsText(file);
        }

        function executeCsvImport(moduleId) {
            if (_csvParsedRows.length === 0) return;
            _csvParsedRows.forEach(row => {
                state.procedureLog.push({
                    ...row,
                    id: crypto.randomUUID(),
                    timestamp: Date.now()
                });
            });
            state.saveData();
            // Sync batch to Firestore subcollection
            if (state.account?.id && window.db) {
                const batch = window.db.batch();
                state.procedureLog.slice(-_csvParsedRows.length).forEach(entry => {
                    if (entry.id) {
                        const ref = window.db.collection('users').doc(state.account.id).collection('procedureLogs').doc(entry.id);
                        batch.set(ref, entry);
                    }
                });
                batch.commit().catch(e => console.error('CSV import subcollection error:', e));
            }
            document.getElementById('csvImportModal').remove();
            renderApp();
            alert(`Successfully imported ${_csvParsedRows.length} procedure entries!`);
            _csvParsedRows = [];
        }

        function toggleAllSections(masterBtn) {
            const container = document.getElementById('app-container');
            if (!container) return;
            // Find all top-level section toggle buttons (direct section headers, not sub-section completed toggles)
            const sectionBtns = container.querySelectorAll('[data-section-toggle]');
            const icon = masterBtn.querySelector('i');
            const label = masterBtn.querySelector('span');
            const isCurrentlyExpanded = label.textContent.trim() === 'Collapse All';

            sectionBtns.forEach(btn => {
                const content = btn.nextElementSibling;
                if (!content) return;
                if (isCurrentlyExpanded) {
                    // Collapse all
                    btn.classList.add('section-collapsed');
                    content.style.display = 'none';

                    // Expand all
                    btn.classList.remove('section-collapsed');
                    content.style.display = '';

            });

            if (isCurrentlyExpanded) {
                icon.className = 'fas fa-expand-alt';
                label.textContent = 'Expand All';

                icon.className = 'fas fa-compress-alt';
                label.textContent = 'Collapse All';

        }
